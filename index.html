<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>듀얼 아카데미아 신입생 시뮬레이터 (GX -2년)</title>
    <style>
        :root {
            --bg-color: #12121a;
            --panel-bg: #1e1e2d;
            --primary: #4a90e2;
            --accent: #f39c12;
            --text: #e0e0e0;
            --monster: #c98855;
            --spell: #1d9e74;
            --trap: #bc5a84;
        }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 200px;
            background-color: #0b0b13;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #333;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 16px;
            color: var(--primary);
        }

        .nav-btn {
            padding: 15px 20px;
            background: none;
            border: none;
            color: #aaa;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #222;
            transition: all 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: var(--panel-bg);
            color: #fff;
            border-left: 4px solid var(--primary);
        }

        .dp-display {
            margin-top: auto;
            padding: 20px;
            background: #111;
            text-align: center;
            font-weight: bold;
            color: var(--accent);
            border-top: 1px solid #333;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        .screen {
            display: none;
            animation: fadeIn 0.3s;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Card Styles */
        .card {
            width: 100px;
            height: 145px;
            border: 2px solid #222;
            border-radius: 5px;
            display: inline-flex;
            flex-direction: column;
            margin: 5px;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            background-color: #333;
            user-select: none;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.05);
            z-index: 10;
        }

        .card.monster { background-color: var(--monster); color: #000; }
        .card.spell { background-color: var(--spell); color: #fff; }
        .card.trap { background-color: var(--trap); color: #fff; }

        .card-name {
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            padding: 5px 2px;
            border-bottom: 1px solid rgba(0,0,0,0.3);
            background: rgba(255,255,255,0.2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-desc {
            font-size: 9px;
            padding: 5px;
            flex: 1;
            overflow: hidden;
        }

        /* Shop Screen */
        .pack-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .pack {
            width: 200px;
            height: 300px;
            background: linear-gradient(45deg, #1d2b64, #f8cdda);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(248, 205, 218, 0.3);
            transition: transform 0.2s;
        }

        .pack:hover {
            transform: scale(1.05);
        }

        .pack h3 { color: #fff; text-shadow: 1px 1px 2px #000; text-align: center; }

        #gacha-result {
            margin-top: 30px;
            min-height: 160px;
            border: 1px dashed #555;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Deck Builder */
        .deck-builder-layout {
            display: flex;
            gap: 20px;
            height: calc(100vh - 100px);
        }

        .builder-panel {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .builder-panel h3 {
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .card-grid {
            flex: 1;
            overflow-y: auto;
            align-content: flex-start;
        }

        /* Simulator */
        .sim-board {
            background: #111;
            border: 2px solid #333;
            height: 400px;
            border-radius: 10px;
            position: relative;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }
        
        .sim-controls {
            margin-bottom: 20px;
        }

        .hand-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            min-height: 150px;
        }

        /* Communication */
        .char-select {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .char-btn {
            padding: 15px;
            background: #2a2a3e;
            border: 1px solid #4a4a6a;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .char-btn:hover { background: #3a3a5e; }

        .dialogue-box {
            background: #1a1a2e;
            border: 2px solid var(--primary);
            border-radius: 10px;
            padding: 20px;
            min-height: 150px;
            position: relative;
        }

        .dialogue-name {
            position: absolute;
            top: -15px;
            left: 20px;
            background: var(--primary);
            color: #fff;
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
        }

        .dialogue-text {
            margin-top: 15px;
            font-size: 18px;
            line-height: 1.5;
        }

        .reply-options {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .reply-btn {
            background: #222;
            border: 1px solid #555;
            color: #ccc;
            padding: 10px;
            text-align: left;
            cursor: pointer;
            border-radius: 5px;
        }

        .reply-btn:hover {
            background: #333;
            color: #fff;
        }

        button {
            font-family: 'Malgun Gothic', sans-serif;
        }
        
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover { background-color: #357abd; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>듀얼 아카데미아</h2>
            <div style="font-size: 12px; margin-top:5px; color:#aaa;">입학연도: 원작 2년 전</div>
        </div>
        <button class="nav-btn active" onclick="switchTab('shop')">카드 샵 (팩 개봉)</button>
        <button class="nav-btn" onclick="switchTab('deck')">덱 빌딩</button>
        <button class="nav-btn" onclick="switchTab('sim')">덱 시뮬레이터</button>
        <button class="nav-btn" onclick="switchTab('chat')">교내 소통</button>
        
        <div class="dp-display">
            DP: <span id="dp-amount">3000</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Shop Screen -->
        <div id="shop" class="screen active">
            <h2>아카데미아 매점</h2>
            <p>1팩에 150 DP입니다. (5장 봉입)</p>
            <div class="pack-container">
                <div class="pack" onclick="openPack()">
                    <h3>초석의 장<br><span style="font-size:12px; font-weight:normal;">Vol.1</span></h3>
                    <p style="font-size:12px; color:#ddd;">Click to Open</p>
                </div>
            </div>
            <div id="gacha-result">
                <!-- 개봉된 카드들이 여기에 표시됩니다 -->
            </div>
        </div>

        <!-- Deck Builder Screen -->
        <div id="deck" class="screen">
            <h2>덱 편성</h2>
            <p>카드를 클릭하여 덱과 트렁크 사이를 이동시키세요. (덱은 40~60장이어야 합니다.)</p>
            <div class="deck-builder-layout">
                <div class="builder-panel">
                    <h3>메인 덱 <span id="deck-count">0 / 60</span></h3>
                    <div id="main-deck-grid" class="card-grid"></div>
                </div>
                <div class="builder-panel">
                    <h3>트렁크 <span id="trunk-count">0</span></h3>
                    <div id="trunk-grid" class="card-grid"></div>
                </div>
            </div>
        </div>

        <!-- Simulator Screen -->
        <div id="sim" class="screen">
            <h2>드로우 시뮬레이터</h2>
            <div class="sim-controls">
                <button class="btn" onclick="testDraw()">패 5장 드로우 (셔플)</button>
                <span id="sim-status" style="margin-left: 15px; color:#aaa;"></span>
            </div>
            <div class="sim-board">
                <div style="position: absolute; top: 20px; left: 20px; color: #555;">DUEL FIELD SIMULATION</div>
                <div id="sim-hand" class="hand-container">
                    <!-- 드로우한 카드가 표시됩니다 -->
                </div>
            </div>
        </div>

        <!-- Communication Screen -->
        <div id="chat" class="screen">
            <h2>교내 자유 구역</h2>
            <p>아카데미아에 갓 입학한 인물들과 대화해 보세요.</p>
            
            <div class="char-select">
                <button class="char-btn" onclick="startChat('ryo')">마루후지 료 (1학년)</button>
                <button class="char-btn" onclick="startChat('fubuki')">텐죠인 후부키 (1학년)</button>
                <button class="char-btn" onclick="startChat('chronos')">크로노스 데 메디치 교수</button>
            </div>

            <div class="dialogue-box" id="dialogue-box" style="display: none;">
                <div class="dialogue-name" id="char-name">이름</div>
                <div class="dialogue-text" id="char-text">대사가 출력됩니다.</div>
                <div class="reply-options" id="reply-options">
                    <!-- 선택지가 생성됩니다 -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- 1. Database ---
        const cardDB = [
            { id: 1, name: "사이버 드래곤", type: "monster", desc: "상대 필드에 몬스터가 존재하고, 자신 필드에 몬스터가 존재하지 않을 경우 패에서 특수 소환할 수 있다." },
            { id: 2, name: "엘리멘틀 히어로 스파크맨", type: "monster", desc: "정전기를 자유롭게 다루는 엘리멘틀 히어로. 번쩍이는 번개 공격으로 악당을 물리친다." },
            { id: 3, name: "엘리멘틀 히어로 페더맨", type: "monster", desc: "바람을 다루는 엘리멘틀 히어로. 하늘에서 일격필살의 공격을 가한다." },
            { id: 4, name: "블랙 매지션", type: "monster", desc: "마법사 중에서 공격력/수비력이 동시에 가장 높은 계급." },
            { id: 5, name: "푸른 눈의 백룡", type: "monster", desc: "높은 공격력을 자랑하는 전설의 드래곤. 어떤 상대라도 분쇄해 버리는 파괴력은 상상을 초월한다." },
            { id: 6, name: "인조인간 -사이코 쇼커-", type: "monster", desc: "이 카드가 필드 위에 앞면 표시로 존재하는 한, 서로 함정 카드를 발동할 수 없으며 필드 위의 함정 카드의 효과는 무효화된다." },
            { id: 7, name: "크리보", type: "monster", desc: "상대 몬스터의 공격 계산시, 이 카드를 패에서 버린다. 그 전투로 인해 발생하는 자신에게로의 전투 데미지는 0 이 된다." },
            { id: 8, name: "융합", type: "spell", desc: "패 또는 필드에서 융합 몬스터 카드에 기재된 융합 소재 몬스터를 묘지로 보내고 융합 소환한다." },
            { id: 9, name: "욕망의 항아리", type: "spell", desc: "자신의 덱에서 카드를 2장 드로우한다." },
            { id: 10, name: "죽은 자의 소생", type: "spell", desc: "자신 또는 상대의 묘지에 있는 몬스터 1장을 선택하고 자신 필드 위에 특수 소환한다." },
            { id: 11, name: "빛의 봉인검", type: "spell", desc: "상대 필드 위의 몬스터를 전부 앞면 표시로 한다. 발동 후 상대 턴에서 세어서 3턴 동안 상대는 공격 선언을 할 수 없다." },
            { id: 12, name: "싸이크론", type: "spell", desc: "필드 위의 마법 / 함정 카드 1장을 선택하고 파괴한다." },
            { id: 13, name: "성스러운 방어막 거울의 힘", type: "trap", desc: "상대 몬스터의 공격 선언시에 발동할 수 있다. 상대 필드 위의 공격 표시 몬스터를 전부 파괴한다." },
            { id: 14, name: "함정 속으로", type: "trap", desc: "상대가 공격력 1000 이상의 몬스터를 일반 소환 / 반전 소환했을 때 발동할 수 있다. 그 몬스터를 파괴한다." },
            { id: 15, name: "매직 실린더", type: "trap", desc: "상대 몬스터의 공격 선언시에 발동할 수 있다. 그 공격을 무효로 하고, 그 몬스터의 공격력만큼의 데미지를 상대 라이프에 준다." }
        ];

        // --- 2. State ---
        let dp = 3000;
        let trunk = [];
        let deck = [];
        
        // --- 3. Init ---
        function init() {
            // 기본 덱 지급
            const starterIds = [2,2,3,3,7,7,8,9,10,12,12,13,14,14,15]; // 15장만 기본 지급
            starterIds.forEach(id => deck.push(id));
            updateDP(0);
            renderDeckBuilder();
        }

        // --- 4. Navigation ---
        function switchTab(tabId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');

            if(tabId === 'deck') renderDeckBuilder();
        }

        function updateDP(amount) {
            dp += amount;
            document.getElementById('dp-amount').innerText = dp;
        }

        // --- 5. UI Helpers ---
        function createCardElement(cardData, onClickFn) {
            const el = document.createElement('div');
            el.className = `card ${cardData.type}`;
            el.innerHTML = `
                <div class="card-name">${cardData.name}</div>
                <div class="card-desc">${cardData.desc}</div>
            `;
            if (onClickFn) el.onclick = onClickFn;
            return el;
        }

        function getCardById(id) {
            return cardDB.find(c => c.id === id);
        }

        // --- 6. Shop / Gacha Logic ---
        function openPack() {
            if (dp < 150) {
                alert("DP가 부족합니다!");
                return;
            }
            updateDP(-150);
            
            const resultContainer = document.getElementById('gacha-result');
            resultContainer.innerHTML = '';
            
            for (let i = 0; i < 5; i++) {
                // 랜덤 카드 선택
                const randomIndex = Math.floor(Math.random() * cardDB.length);
                const drawnCard = cardDB[randomIndex];
                
                trunk.push(drawnCard.id); // 트렁크에 추가
                
                const cardEl = createCardElement(drawnCard);
                // 등장 애니메이션 효과를 위해 지연 추가
                setTimeout(() => {
                    resultContainer.appendChild(cardEl);
                }, i * 150);
            }
        }

        // --- 7. Deck Builder Logic ---
        function renderDeckBuilder() {
            const deckGrid = document.getElementById('main-deck-grid');
            const trunkGrid = document.getElementById('trunk-grid');
            
            deckGrid.innerHTML = '';
            trunkGrid.innerHTML = '';
            
            // 덱 렌더링
            deck.forEach((cardId, index) => {
                const cardData = getCardById(cardId);
                deckGrid.appendChild(createCardElement(cardData, () => moveToTrunk(index)));
            });
            
            // 트렁크 렌더링
            trunk.forEach((cardId, index) => {
                const cardData = getCardById(cardId);
                trunkGrid.appendChild(createCardElement(cardData, () => moveToDeck(index)));
            });

            document.getElementById('deck-count').innerText = `${deck.length} / 60`;
            document.getElementById('deck-count').style.color = (deck.length >= 40 && deck.length <= 60) ? "#fff" : "#ff4444";
            document.getElementById('trunk-count').innerText = trunk.length;
        }

        function moveToDeck(trunkIndex) {
            if (deck.length >= 60) {
                alert("덱은 최대 60장까지만 구성할 수 있습니다.");
                return;
            }
            const cardId = trunk.splice(trunkIndex, 1)[0];
            deck.push(cardId);
            renderDeckBuilder();
        }

        function moveToTrunk(deckIndex) {
            const cardId = deck.splice(deckIndex, 1)[0];
            trunk.push(cardId);
            renderDeckBuilder();
        }

        // --- 8. Simulator Logic ---
        function testDraw() {
            if (deck.length < 5) {
                document.getElementById('sim-status').innerText = "오류: 덱에 카드가 5장 이상 필요합니다.";
                document.getElementById('sim-status').style.color = "#ff4444";
                return;
            }

            document.getElementById('sim-status').innerText = "셔플 및 드로우 완료!";
            document.getElementById('sim-status').style.color = "var(--spell)";

            const handContainer = document.getElementById('sim-hand');
            handContainer.innerHTML = '';

            // 덱 복사 및 셔플 (피셔-예이츠 셔플)
            let tempDeck = [...deck];
            for (let i = tempDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tempDeck[i], tempDeck[j]] = [tempDeck[j], tempDeck[i]];
            }

            // 5장 드로우
            for (let i = 0; i < 5; i++) {
                const cardData = getCardById(tempDeck.pop());
                const cardEl = createCardElement(cardData);
                handContainer.appendChild(cardEl);
            }
        }

        // --- 9. Communication Logic (Visual Novel Style) ---
        const dialogues = {
            ryo: {
                name: "마루후지 료",
                start: "나는 마루후지 료. 오벨리스크 블루 1학년이다. 너도 이번에 입학한 신입생인가?",
                options: [
                    { text: "네, 잘 부탁드립니다!", next: "ryo_polite" },
                    { text: "제가 바로 훗날의 듀얼 킹입니다.", next: "ryo_arrogant" }
                ]
            },
            ryo_polite: {
                name: "마루후지 료",
                start: "그래. 예의 바른 후배군. 아직 내 사이버 유파는 미완성이지만, 듀얼 아카데미아에서 완벽을 추구할 생각이다. 언젠가 듀얼 필드에서 만나게 될지도 모르겠군.",
                options: []
            },
            ryo_arrogant: {
                name: "마루후지 료",
                start: "...호기가 넘치는군. 그 자신감이 실력에서 나오는 것인지, 아니면 단순한 만용인지는 앞으로의 실기 시험에서 증명해라.",
                options: []
            },
            fubuki: {
                name: "텐죠인 후부키",
                start: "앗하하! 안녕, 신입생! 난 텐죠인 후부키. 입학 첫날부터 너무 딱딱하게 굴지 말고, 나와 함께 아카데미아 아이돌 데뷔 프로젝트를 짜보지 않을래?",
                options: [
                    { text: "아이돌이요? 듀얼리스트 양성 학교가 아닌가요?", next: "fubuki_confused" },
                    { text: "좋습니다! 형님으로 모시겠습니다!", next: "fubuki_join" }
                ]
            },
            fubuki_confused: {
                name: "텐죠인 후부키",
                start: "듀얼도 결국 엔터테인먼트! 관객을 사로잡는 매력이 있어야 진정한 톱 듀얼리스트라 할 수 있지. 여동생인 아스카도 내년엔 입학할 텐데, 벌써부터 기대가 되는걸!",
                options: []
            },
            fubuki_join: {
                name: "텐죠인 후부키",
                start: "오! 말이 통하는 녀석이네! 좋아, 오늘부터 넌 내 1호 팬이자 제자다. 우선 사인을 만드는 법부터 연구해보자고!",
                options: []
            },
            chronos: {
                name: "크로노스 데 메디치",
                start: "맘마미아! 거기 신입생! 기숙사 배정은 끝났나-네? 나 크로노스는 엘리트들인 오벨리스크 블루만을 가르치고 싶지만, 규정상 어쩔 수 없지-네.",
                options: [
                    { text: "수업 방식이 기대됩니다, 교수님.", next: "chronos_good" },
                    { text: "(무시하고 지나간다)", next: "chronos_ignore" }
                ]
            },
            chronos_good: {
                name: "크로노스 데 메디치",
                start: "오호라? 제법 싹수가 보이는 학생이-네. 열심히 해서 오벨리스크 블루로 승급할 수 있도록 실력을 닦으세-요!",
                options: []
            },
            chronos_ignore: {
                name: "크로노스 데 메디치",
                start: "노네네네! 감히 교수인 이 크로노스를 무시하다니! 너 같은 드롭아웃 보이는 당장 오시리스 레드 확정이-네! 내 수업에서 낙제점을 주겠어-요!",
                options: []
            }
        };

        function startChat(charId) {
            document.getElementById('dialogue-box').style.display = 'block';
            renderDialogue(charId);
        }

        function renderDialogue(nodeId) {
            const data = dialogues[nodeId];
            document.getElementById('char-name').innerText = data.name;
            
            const textEl = document.getElementById('char-text');
            textEl.innerText = "";
            let i = 0;
            const typingInterval = setInterval(() => {
                textEl.innerText += data.start.charAt(i);
                i++;
                if (i >= data.start.length) {
                    clearInterval(typingInterval);
                    renderOptions(data.options);
                }
            }, 30); // 타이핑 효과
        }

        function renderOptions(options) {
            const optionsContainer = document.getElementById('reply-options');
            optionsContainer.innerHTML = '';
            
            if (options && options.length > 0) {
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'reply-btn';
                    btn.innerText = "▶ " + opt.text;
                    btn.onclick = () => {
                        optionsContainer.innerHTML = '';
                        renderDialogue(opt.next);
                    };
                    optionsContainer.appendChild(btn);
                });
            } else {
                const btn = document.createElement('button');
                btn.className = 'reply-btn';
                btn.style.textAlign = 'center';
                btn.innerText = "대화 종료";
                btn.onclick = () => {
                    document.getElementById('dialogue-box').style.display = 'none';
                };
                optionsContainer.appendChild(btn);
            }
        }

        // 초기화 실행
        window.onload = init;
    </script>
</body>
</html>
